<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Flower Prediction Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <h1>🌸 AI Flower Prediction Assistant</h1>

        <p class="subtitle">
            Enter flower measurements to predict its species
        </p>


        <form method="POST">

            <label>Sepal Length (cm)</label>

            <input
                type="number"
                step="0.1"
                name="sepal_length"
                placeholder="Example: 5.1"
                required
            >


            <label>Sepal Width (cm)</label>

            <input
                type="number"
                step="0.1"
                name="sepal_width"
                placeholder="Example: 3.5"
                required
            >


            <label>Petal Length (cm)</label>

            <input
                type="number"
                step="0.1"
                name="petal_length"
                placeholder="Example: 1.4"
                required
            >


            <label>Petal Width (cm)</label>

            <input
                type="number"
                step="0.1"
                name="petal_width"
                placeholder="Example: 0.2"
                required
            >


            <button type="submit">
                Predict Flower 🌸
            </button>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>
                🌸 Prediction:
                {{ prediction|capitalize }}
            </h2>

            <h3>🧠 AI Explanation</h3>

            <p>
                {{ explanation }}
            </p>

        </div>

        {% endif %}


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}

    </div>

</body>

</html>
